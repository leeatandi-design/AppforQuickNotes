<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Simple Note Taking</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture ideas quickly, stay organized.</p>
  </header>

  <main>
    <section id="add-section">
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note text</label>
        <input type="text" id="note-input" placeholder="Type your note here..." maxlength="201">
        <select id="note-category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
        </select>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message" aria-live="polite"></p>
    </section>

    <section id="notes-section">
      <h2>Your notes</h2>
      <input type="text" id="search-input" placeholder="Search notes...">
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
      <button id="clear-all-btn">Clear all</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes App</p>
  </footer>
</body>
</html>
